apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: production-cluster-in-a-box
  annotations:
    argocd.argoproj.io/sync-wave: "61"
    # Production flip: change only letsencrypt-prod to letsencrypt-prod after staging verification.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - grafana.meshari.xyz
      secretName: grafana-tls
  rules:
    - host: grafana.meshari.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http-web
