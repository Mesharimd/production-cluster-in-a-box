apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-grafana-datasource
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "42"
  labels:
    grafana_datasource: "1"
data:
  loki.yaml: |-
    apiVersion: 1
    prune: true
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.logging.svc.cluster.local:3100
        isDefault: false
        editable: false
